# Defaults baked into the binary and the image.
# Override with --config <file> (merged key by key) or env vars (see README).
# Secrets are env-only and never belong here.
http:
  addr: ":8080"
  public_url: "http://localhost:8080"
paths:
  incomplete: "/data/incomplete"
  downloads: "/data/downloads"
worker:
  jobs: 1
  segment_concurrency: 8
  # Tries per segment and subtitle. The wait between tries starts at
  # segment_backoff and doubles. When the tries run out, the job fails.
  segment_attempts: 5
  segment_backoff: "1s"
  # Re-encode for sources that are not H.264 video or AAC audio.
  x264_preset: "veryfast"
  x264_crf: 20
  aac_bitrate: "192k"
uakino:
  cache_ttl: "720h"
  # Site root. Change it when UAKino moves to a new domain.
  base_url: "https://uakino.best"
  # Requests per second to the site. Player pages and the CDN are not limited.
  rps: 1
  # Hosts accepted as inline movie players (iframe#pre), subdomains included.
  player_hosts: ["ashdi.vip"]
tmdb:
  base_url: "https://api.themoviedb.org/3"
