image:
  repository: ghcr.io/vmorshc/hls-indexer
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# The GHCR package is private: pull secret ghcr-pull is created in the cluster by hand.
imagePullSecrets:
  - name: ghcr-pull

replicaCount:
  api: 1
  worker: 1

service:
  type: ClusterIP
  port: 8080

# Local development keys, same as compose.yaml. Override them for real use.
secrets:
  indexerApiKey: indexer-local-key
  downloaderApiKey: downloader-local-key
  tmdbApiKey: ""

config:
  publicUrl: http://localhost:8080

persistence:
  data:
    size: 1Gi
  redis:
    size: 1Gi

redis:
  image: redis:8-alpine
