apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keys
  labels:
    {{- include "hls-indexer.labels" . | nindent 4 }}
type: Opaque
stringData:
  INDEXER_API_KEY: {{ .Values.secrets.indexerApiKey | quote }}
  DOWNLOADER_API_KEY: {{ .Values.secrets.downloaderApiKey | quote }}
  TMDB_API_KEY: {{ .Values.secrets.tmdbApiKey | quote }}
