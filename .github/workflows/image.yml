# Build, version and push the image; then write the version into the chart repository.
name: image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vmorshc/hls-indexer
  # Release line. The patch number is the workflow run number.
  VERSION_LINE: "0.1"
  CHART_REPO: vmorshc/hls-indexer-chart

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          echo "version=${VERSION_LINE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CHART_REPO }}
          ssh-key: ${{ secrets.CHART_DEPLOY_KEY }}
          ref: main

      - name: Set image tag
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          sed -i "s|^  tag: .*|  tag: \"$VERSION\"|" charts/hls-indexer/values.yaml
          sed -i "s|^version: .*|version: $VERSION|; s|^appVersion: .*|appVersion: \"$VERSION\"|" charts/hls-indexer/Chart.yaml
          git diff

      - name: Commit
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "hls-indexer $VERSION (${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main
